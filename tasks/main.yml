---
- name: Ensure an ingress hostname is provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_ingress_hostname is string
      - svc_wordpress_ingress_hostname | length > 0
    fail_msg: >-
      svc_wordpress_ingress_hostname is required so the service can be routed
      through the ingress controller.

- name: Ensure a configuration output path is provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_lxc_config_path is string
      - svc_wordpress_lxc_config_path | length > 0
  fail_msg: >-
      svc_wordpress_lxc_config_path must point to the destination file where the
      rendered LXC definition should be written.

- name: Determine exports env path
  ansible.builtin.set_fact:
    _svc_wordpress_exports_env_path: >-
      {% set _configured_path = svc_wordpress_exports_env_path | default('', true) %}
      {% if _configured_path | length > 0 %}
      {{ _configured_path }}
      {% else %}
      {{ (svc_wordpress_lxc_config_path | dirname) ~ '/exports.env' }}
      {% endif %}

- name: Validate dependency exports structure when provided
  ansible.builtin.assert:
    that:
      - dependency_exports is mapping
      - ('database' not in dependency_exports) or (dependency_exports.database is mapping and dependency_exports.database.env is mapping)
      - ('redis' not in dependency_exports) or (dependency_exports.redis is mapping and dependency_exports.redis.env is mapping)
    fail_msg: >-
      dependency_exports must be a mapping containing per-service dictionaries
      with an env mapping. Ensure the MariaDB and Redis service exports were
      passed through unchanged.
  when: dependency_exports is defined

- name: Ensure the exports env path is valid
  ansible.builtin.assert:
    that:
      - _svc_wordpress_exports_env_path is string
      - _svc_wordpress_exports_env_path | length > 0
    fail_msg: >-
      Unable to determine a path for exports.env. Provide
      svc_wordpress_exports_env_path or ensure svc_wordpress_lxc_config_path has
      a parent directory.

- name: Ensure database credentials are provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_db_password is string
      - svc_wordpress_db_password | length > 0
  fail_msg: >-
      The WordPress database password must be supplied via an Ansible vault or
      secret.

- name: Ensure the database endpoint is discoverable
  ansible.builtin.assert:
    that:
      - (
          svc_wordpress_db_host is string
          and svc_wordpress_db_host | length > 0
          and svc_wordpress_db_port | string | length > 0
        )
        or (
          DATABASE_HOST is defined
          and DATABASE_HOST | length > 0
          and DATABASE_PORT is defined
          and DATABASE_PORT | string | length > 0
        )
  fail_msg: >-
      Provide svc_wordpress_db_host/svc_wordpress_db_port or ensure the
      DATABASE_HOST/DATABASE_PORT exports from the database service are
      available to this role.

- name: Ensure the WordPress URL aligns with the ingress hostname
  ansible.builtin.assert:
    that:
      - svc_wordpress_url is string
      - svc_wordpress_url | length > 0
      - (svc_wordpress_url | urlsplit('hostname')) == svc_wordpress_ingress_hostname
    fail_msg: >-
      svc_wordpress_url must reference the same hostname as
      svc_wordpress_ingress_hostname to avoid redirect loops.

- name: Ensure Redis credentials are provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_redis_password is string
      - svc_wordpress_redis_password | length > 0
  fail_msg: >-
      The Redis cache password must be supplied via an Ansible vault or secret.

- name: Ensure object storage credentials are provided when enabled
  ansible.builtin.assert:
    that:
      - svc_wordpress_object_storage_bucket | length > 0
      - svc_wordpress_object_storage_region | length > 0
      - svc_wordpress_object_storage_access_key | length > 0
      - svc_wordpress_object_storage_secret_key | length > 0
    fail_msg: >-
      When svc_wordpress_enable_object_storage is true, provide the bucket name,
      region, and access credentials via the corresponding variables or secret
      exports.
  when: svc_wordpress_enable_object_storage | bool

- name: Ensure Redis TLS materials are available when peer verification is enabled
  ansible.builtin.assert:
    that:
      - svc_wordpress_redis_tls_secret | length > 0
    fail_msg: >-
      Provide svc_wordpress_redis_tls_secret when TLS is enabled and peer
      verification is required so the CA certificate can be mounted in the
      workload.
  when:
    - svc_wordpress_enable_object_cache | bool
    - svc_wordpress_redis_use_tls | bool
    - svc_wordpress_redis_verify_peer | bool

- name: Ensure WordPress authentication keys are provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_auth_keys is mapping
      - svc_wordpress_auth_keys | length == 8
      - svc_wordpress_auth_keys.AUTH_KEY | length > 0
      - svc_wordpress_auth_keys.SECURE_AUTH_KEY | length > 0
      - svc_wordpress_auth_keys.LOGGED_IN_KEY | length > 0
      - svc_wordpress_auth_keys.NONCE_KEY | length > 0
      - svc_wordpress_auth_keys.AUTH_SALT | length > 0
      - svc_wordpress_auth_keys.SECURE_AUTH_SALT | length > 0
      - svc_wordpress_auth_keys.LOGGED_IN_SALT | length > 0
      - svc_wordpress_auth_keys.NONCE_SALT | length > 0
  fail_msg: >-
      All WordPress authentication keys and salts must be provided via an
      encrypted variable or secret export.

- name: Ensure must-use plugin mapping is a dictionary when provided
  ansible.builtin.assert:
    that:
      - svc_wordpress_mu_plugins is mapping
    fail_msg: >-
      svc_wordpress_mu_plugins must be a mapping of filenames to plugin
      contents when defining must-use plugins.
  when: svc_wordpress_mu_plugins | length > 0

- name: Ensure multisite configuration is complete when enabled
  ansible.builtin.assert:
    that:
      - svc_wordpress_multisite is mapping
      - svc_wordpress_multisite.site_domain | length > 0
      - svc_wordpress_multisite.site_path | length > 0
      - svc_wordpress_multisite.site_path.startswith('/')
      - svc_wordpress_multisite.site_id | int > 0
      - svc_wordpress_multisite.blog_id | int > 0
    fail_msg: >-
      When svc_wordpress_enable_multisite is true, provide the site domain, path,
      and numeric identifiers so WordPress can initialise the network.
  when: svc_wordpress_enable_multisite | bool

- name: Render the LXC workload definition
  ansible.builtin.template:
    src: lxc.yml.j2
    dest: "{{ svc_wordpress_lxc_config_path }}"
    mode: "0640"

- name: Ensure the exports env directory exists
  ansible.builtin.file:
    path: "{{ _svc_wordpress_exports_env_path | dirname }}"
    state: directory
    mode: "0750"
  when: (_svc_wordpress_exports_env_path | dirname) not in ['', '/']

- name: Render the exports env file
  ansible.builtin.copy:
    dest: "{{ _svc_wordpress_exports_env_path }}"
    mode: "0640"
    content: |-
      APP_FQDN={{ svc_wordpress_ingress_hostname }}
      APP_PORT={{ '443' if svc_wordpress_scheme == 'https' else '80' }}
      BACKEND_IP={{ svc_wordpress_name }}

- name: Validate the rendered exports env file
  ansible.builtin.set_fact:
    _svc_wordpress_exports_env_content: "{{ lookup('ansible.builtin.file', _svc_wordpress_exports_env_path) }}"

- name: Ensure exports env file contains required keys
  ansible.builtin.assert:
    that:
      - _svc_wordpress_exports_env_content | regex_search('^APP_FQDN=.+$', multiline=True)
      - _svc_wordpress_exports_env_content | regex_search('^APP_PORT=\d+$', multiline=True)
      - _svc_wordpress_exports_env_content | regex_search('^BACKEND_IP=.+$', multiline=True)
    fail_msg: >-
      The generated exports.env file is missing required keys. Inspect the
      rendered file at {{ _svc_wordpress_exports_env_path }} for syntax errors.
